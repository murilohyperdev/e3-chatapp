# Development stack: Laravel API + React (Vite) + PostgreSQL + Mailpit.
# Host ports are configurable through a root .env file (see .env.example).
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      # Where the Vite dev server forwards /api requests (compose service name).
      API_PROXY_TARGET: http://backend:8000
    # Install deps on first run, then start Vite listening on all interfaces.
    command: sh -c "[ -d node_modules/.bin ] || npm ci; npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: e3chat
      POSTGRES_USER: e3chat
      POSTGRES_PASSWORD: e3chat_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      # 5433 by default so it does not clash with a PostgreSQL already on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e3chat -d e3chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local inbox for password-recovery emails: SMTP on 1025, web UI on 8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
